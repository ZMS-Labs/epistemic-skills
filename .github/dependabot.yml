# Pin gardening (gauntlet upgrades-landing-2026-08-03 ruling R11): the
# supply-chain hardening pinned every action to an immutable SHA; this config
# gives the pin inventory a renewal path — updates arrive as reviewable
# SHA re-pin pull requests instead of silent tag drift. The pin-inventory
# owner and revisit conditions are recorded in .ledger/entries.jsonl
# (pin-inventory-gardening-20260804-10).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "pin-gardening"
    # Grouped updates (Phase 3, ZMS-Labs/zms-homelab#1719): collapse many
    # single-dependency PRs into one PR per severity band, cutting the
    # downstream CI fan-out. Majors ride in their own PR so a breaking
    # action bump is never merged alongside routine patch re-pins.
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
