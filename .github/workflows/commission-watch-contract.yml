name: commission-watch-contract

"on":
  workflow_dispatch:
  push:
    # WIP branches are agent scratch; the gate runs on merge to main and on
    # non-draft PRs, not on every push to a development branch.
    branches: [main]
    # NO paths filter (gauntlet ruling R7 path A, applied here after the
    # whole-tree-reader rule in v6_audit_workflow_oracles.py flagged this
    # workflow): the "Package structural invariants" step and the clean-room
    # gate read the whole tree, so a paths: list was a second hand-maintained
    # projection of the checks' inputs — the same silent-miss class as the
    # 2026-08-06 README incident on the main suite.
  pull_request:
    # ready_for_review included so gating jobs actually dispatch when a
    # draft PR is marked ready -- the takeover KL-DRAFT-CI promised.
    # Mirrors dco.yml; gauntlet ruling R8 (es-v6-candidate-freeze-2026-08-18).
    types: [opened, synchronize, reopened, ready_for_review]
    # NO paths filter — same R7 rationale as push above.

permissions:
  contents: read

jobs:
  contract:
    # Draft PRs are agent WIP; the gate runs when the PR is marked ready.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tested revision without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Record the exact tested revision
        run: |
          echo "candidate_sha=$(git rev-parse HEAD)"
          git status --short
      - name: Watch commission semantic and schema contract
        run: python plugins/epistemic-skills/contracts/watch-commission/test_watch_commission.py
      - name: Compile watch commission verifier
        run: python -m py_compile plugins/epistemic-skills/contracts/watch-commission/verify_watch_commission.py
      - name: Validate every accepted watch commission example
        shell: bash
        run: |
          mapfile -t examples < <(find plugins/epistemic-skills/contracts/watch-commission/examples -maxdepth 1 -name 'valid-*.json' -print | sort)
          test "${#examples[@]}" -gt 0
          python plugins/epistemic-skills/contracts/watch-commission/verify_watch_commission.py "${examples[@]}"
      - name: Watch and package sentinel oracles
        run: |
          python .github/scripts/score_sentinels.py --self-test
          python .github/scripts/score_sentinels.py
      - name: Description budget
        run: |
          python .github/scripts/check_description_budget.py --self-test
          python .github/scripts/check_description_budget.py --report
          python .github/scripts/check_description_budget.py
      - name: Package structural invariants
        run: |
          python .github/scripts/check_json_artifacts.py
          python .github/scripts/check_no_phantom_skills.py
          python .github/scripts/check_skill_inventory.py
          python .github/scripts/sync_skill_surfaces.py --check
          git diff --check
      - name: Canonical clean-room package gate
        run: bash .github/scripts/cleanroom_ci.sh "$(git rev-parse HEAD)"
