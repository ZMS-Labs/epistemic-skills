name: DCO

on:
  pull_request_target:
    # ready_for_review included so a PR opened as draft gets its DCO check
    # the moment it becomes a real candidate.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

# `pull_request_target` runs in the context of the BASE branch, so `github.ref`
# is `refs/heads/main` for every pull request -- a group keyed on it would make
# one PR's DCO run cancel an unrelated PR's. Key on the pull request number, so
# only a newer revision of the SAME pull request supersedes.
concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: DCO
    # Draft PRs are agent WIP; the check runs when the PR is marked ready.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          # Full history: classifying a merge commit needs its parents and their
          # merge base, which a shallow clone does not have.
          fetch-depth: 0
      # Fetch the pull request's OBJECTS so the checker can decide whether each
      # merge commit authored content. This fetches data only -- no code from the
      # pull request is executed by this job, which is what pull_request_target
      # requires. Without it every merge would be unverifiable and fail closed.
      - name: Fetch pull-request objects (no checkout, no execution)
        run: |
          git fetch --no-tags --quiet origin \
            "refs/pull/${{ github.event.pull_request.number }}/head"
      - name: DCO checker self-test (planted RED controls)
        run: python .github/scripts/check_dco.py --self-test
      - name: Require author-matching Signed-off-by lines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/check_dco.py
