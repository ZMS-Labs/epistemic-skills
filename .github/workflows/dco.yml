name: DCO

on:
  pull_request_target:
    # ready_for_review included so a PR opened as draft gets its DCO check
    # the moment it becomes a real candidate.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: DCO
    # Draft PRs are agent WIP; the check runs when the PR is marked ready.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: DCO checker self-test (planted RED controls)
        run: python .github/scripts/check_dco.py --self-test
      - name: Require author-matching Signed-off-by lines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/check_dco.py
