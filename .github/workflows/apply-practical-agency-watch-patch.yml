name: apply-practical-agency-watch-patch

"on":
  push:
    branches:
      - chatgpt/practical-agency-manifest
    paths:
      - ".github/scripts/apply_practical_agency_watch_patch.py"
      - ".github/workflows/apply-practical-agency-watch-patch.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the branch with push credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/practical-agency-manifest
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply exact live-surface migration
        run: python .github/scripts/apply_practical_agency_watch_patch.py
      - name: Verify focused semantics and package invariants
        run: |
          python plugins/epistemic-skills/contracts/watch-commission/test_watch_commission.py
          python .github/scripts/score_sentinels.py --self-test
          python .github/scripts/score_sentinels.py
          python .github/scripts/check_description_budget.py --report
          python .github/scripts/check_description_budget.py
          python .github/scripts/check_json_artifacts.py
          python .github/scripts/check_no_phantom_skills.py
          python .github/scripts/check_skill_inventory.py
          python .github/scripts/sync_skill_surfaces.py --check
          git diff --check
      - name: Commit generated migration
        run: |
          if git diff --quiet; then
            echo "Expected migration produced no diff" >&2
            exit 1
          fi
          git config user.name "SternOne"
          git config user.email "89846440+SternOne@users.noreply.github.com"
          git add README.md \
            .github/scripts/check_description_budget.py \
            plugins/epistemic-skills/skills/health/SKILL.md
          git commit -m "docs: align commission-watch live surfaces" \
            -m "Lock the exact 8,159-byte description total and update current README and health guidance so only a commissioned external observer is described as watching." \
            -m "Signed-off-by: SternOne <89846440+SternOne@users.noreply.github.com>"
          git push origin HEAD:chatgpt/practical-agency-manifest
