name: release-security

"on":
  # Manual trigger, so the full-history scan can be run against the exact commit
  # being released rather than only as a side effect of pushing one.
  workflow_dispatch:
  # Secrets can be introduced anywhere in the tree. Do not narrow either trigger
  # with path filters: doing so creates an unscanned path to main.
  pull_request:
    # ready_for_review included so gating jobs actually dispatch when a
    # draft PR is marked ready -- the takeover KL-DRAFT-CI promised.
    # Mirrors dco.yml; gauntlet ruling R8 (es-v6-candidate-freeze-2026-08-18).
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  full-history-secret-scan:
    # Draft PRs are agent WIP; the scan runs when the PR is marked ready.
    # This narrows nothing about WHAT is scanned -- every non-draft PR and
    # every push to main still gets the full-history scan.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the complete history without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.1"
          check-latest: false
      - name: Install pinned gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Prove the scanner detects a planted secret
        run: |
          fixture="$(mktemp -d)"
          {
            printf '%s%s\n' '-----BEGIN RSA ' 'PRIVATE KEY-----'
            printf '%s\n' 'MIIEpAIBAAKCAQEAu4M7h2X9pQ6sV3nK8cD1fG5jL0wZrY2bT7mN9xE4'
            printf '%s%s\n' '-----END RSA ' 'PRIVATE KEY-----'
          } > "$fixture/positive-control.txt"
          set +e
          "$RUNNER_TEMP/bin/gitleaks" dir --no-banner --redact "$fixture"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "gitleaks positive control was not detected" >&2
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "gitleaks positive control failed with unexpected status $status" >&2
            exit "$status"
          fi
      - name: Prove the digest allowlist is narrow
        run: |
          fixture="$(mktemp -d)"
          digest="$(printf '%s%s' '663a543d009ec261190a6ab8a8a45f02a' 'c80ed052aceb90e924ec96a20d76ed8')"
          printf '"%s": "%s"\n' 'credential_digest' "$digest" > "$fixture/allowed.json"
          "$RUNNER_TEMP/bin/gitleaks" dir --config .gitleaks.toml --no-banner --redact "$fixture/allowed.json"
          printf '"%s": "%s"\n' 'credential' "$digest" > "$fixture/rejected.json"
          set +e
          "$RUNNER_TEMP/bin/gitleaks" dir --config .gitleaks.toml --no-banner --redact "$fixture/rejected.json"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "gitleaks digest allowlist accepted a neighboring credential field" >&2
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "gitleaks narrowness control failed with unexpected status $status" >&2
            exit "$status"
          fi
      - name: Gauntlet-record allowlist narrowness control
        # R4-NF2 (rc4 delta-review panel): the record-path exemption in
        # .gitleaks.toml suppresses the generic-api-key ENTROPY heuristic under
        # docs/gauntlet-runs/ only, because verifier prose there quotes Actions
        # run ids beside the word "API". This control proves the exemption is
        # narrow: the SAME planted line must FIRE outside that directory and be
        # suppressed inside it, and a provider-branded credential must fire even
        # inside it. A widened exemption turns this step red.
        run: |
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/docs/gauntlet-runs/probe" "$fixture/src"
          token="$(printf '%s%s' 'zk9x2m4qv7r8t1w3y5u6i9' 'o0p2a4s6d8f0g1h3j5kq')"
          printf '"api_key": "%s"\n' "$token" > "$fixture/src/config.json"
          printf '"api_key": "%s"\n' "$token" > "$fixture/docs/gauntlet-runs/probe/report.json"
          set +e
          "$RUNNER_TEMP/bin/gitleaks" dir --config .gitleaks.toml --no-banner --redact "$fixture/src"
          outside=$?
          "$RUNNER_TEMP/bin/gitleaks" dir --config .gitleaks.toml --no-banner --redact "$fixture/docs"
          inside=$?
          set -e
          if [ "$outside" -ne 1 ]; then
            echo "narrowness control: planted entropy token did NOT fire outside docs/gauntlet-runs (status $outside)" >&2
            exit 1
          fi
          if [ "$inside" -ne 0 ]; then
            echo "narrowness control: exemption did not apply inside docs/gauntlet-runs (status $inside)" >&2
            exit 1
          fi
          printf '%s%s\n' 'ghp_' 'A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8' > "$fixture/docs/gauntlet-runs/probe/branded.txt"
          set +e
          "$RUNNER_TEMP/bin/gitleaks" dir --config .gitleaks.toml --no-banner --redact "$fixture/docs"
          branded=$?
          set -e
          if [ "$branded" -ne 1 ]; then
            echo "narrowness control: a provider-branded credential was suppressed inside docs/gauntlet-runs (status $branded)" >&2
            exit 1
          fi
          echo "narrowness control: entropy exemption is record-path-scoped; branded credentials still fire"
      - name: Scan the complete repository history
        run: |
          "$RUNNER_TEMP/bin/gitleaks" git --config .gitleaks.toml --no-banner --redact --log-opts="--all" .
