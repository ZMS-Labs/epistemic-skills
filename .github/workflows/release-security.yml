name: release-security

"on":
  pull_request:
    paths:
      - "README.md"
      - "RELEASING.md"
      - "docs/release/**"
      - ".claude-plugin/**"
      - ".cursor-plugin/**"
      - ".kimi-plugin/**"
      - "gemini-extension.json"
      - "plugins/epistemic-skills/.claude-plugin/**"
      - "plugins/epistemic-skills/.codex-plugin/**"
      - "plugins/epistemic-skills/.cursor-plugin/**"
      - "plugins/epistemic-skills/.kimi-plugin/**"
      - ".github/workflows/release-security.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "RELEASING.md"
      - "docs/release/**"
      - ".claude-plugin/**"
      - ".cursor-plugin/**"
      - ".kimi-plugin/**"
      - "gemini-extension.json"
      - "plugins/epistemic-skills/.claude-plugin/**"
      - "plugins/epistemic-skills/.codex-plugin/**"
      - "plugins/epistemic-skills/.cursor-plugin/**"
      - "plugins/epistemic-skills/.kimi-plugin/**"
      - ".github/workflows/release-security.yml"

permissions:
  contents: read

jobs:
  full-history-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install pinned gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Prove the scanner detects a planted secret
        run: |
          fixture="$(mktemp -d)"
          {
            printf 'aws_access_key_id = AKIA%s\n' '1111111111111111'
            printf 'aws_secret_access_key = %s%s\n' 'wJalrXUtnFEMI/K7MDENG/' 'bPxRfiCYEXAMPLEKEY'
          } > "$fixture/positive-control.txt"
          if "$RUNNER_TEMP/bin/gitleaks" dir --no-banner --redact "$fixture"; then
            echo "gitleaks positive control was not detected" >&2
            exit 1
          fi
      - name: Scan the complete repository history
        run: |
          "$RUNNER_TEMP/bin/gitleaks" git --no-banner --redact --log-opts="--all" .
