name: release-security

"on":
  # Manual trigger, so the full-history scan can be run against the exact commit
  # being released rather than only as a side effect of pushing one.
  workflow_dispatch:
  # Secrets can be introduced anywhere in the tree. Do not narrow either trigger
  # with path filters: doing so creates an unscanned path to main.
  pull_request:
    # ready_for_review included so gating jobs actually dispatch when a
    # draft PR is marked ready -- the takeover KL-DRAFT-CI promised.
    # Mirrors dco.yml; gauntlet ruling R8 (es-v6-candidate-freeze-2026-08-18).
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  full-history-secret-scan:
    # Draft PRs are agent WIP; the scan runs when the PR is marked ready.
    # This narrows nothing about WHAT is scanned -- every non-draft PR and
    # every push to main still gets the full-history scan.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the complete history without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.1"
          check-latest: false
      - name: Install pinned gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Prove the scanner detects a planted secret
        run: |
          fixture="$(mktemp -d)"
          {
            printf '%s%s\n' '-----BEGIN RSA ' 'PRIVATE KEY-----'
            printf '%s\n' 'MIIEpAIBAAKCAQEAu4M7h2X9pQ6sV3nK8cD1fG5jL0wZrY2bT7mN9xE4'
            printf '%s%s\n' '-----END RSA ' 'PRIVATE KEY-----'
          } > "$fixture/positive-control.txt"
          set +e
          "$RUNNER_TEMP/bin/gitleaks" dir --no-banner --redact "$fixture"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "gitleaks positive control was not detected" >&2
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "gitleaks positive control failed with unexpected status $status" >&2
            exit "$status"
          fi
      - name: Prove the digest allowlist is narrow
        run: |
          fixture="$(mktemp -d)"
          digest="$(printf '%s%s' '663a543d009ec261190a6ab8a8a45f02a' 'c80ed052aceb90e924ec96a20d76ed8')"
          printf '"%s": "%s"\n' 'credential_digest' "$digest" > "$fixture/allowed.json"
          "$RUNNER_TEMP/bin/gitleaks" dir --config .gitleaks.toml --no-banner --redact "$fixture/allowed.json"
          printf '"%s": "%s"\n' 'credential' "$digest" > "$fixture/rejected.json"
          set +e
          "$RUNNER_TEMP/bin/gitleaks" dir --config .gitleaks.toml --no-banner --redact "$fixture/rejected.json"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "gitleaks digest allowlist accepted a neighboring credential field" >&2
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "gitleaks narrowness control failed with unexpected status $status" >&2
            exit "$status"
          fi
      - name: Gauntlet-record allowlist narrowness control
        # R4-NF2 (rc4 delta-review panel): the record-path exemption in
        # .gitleaks.toml suppresses the generic-api-key ENTROPY heuristic under
        # ^docs/gauntlet-runs/ only, because verifier prose there quotes Actions
        # run ids beside the word "API". This control plants one identical token
        # in three places and asserts exactly which ones fire. It must run the
        # SAME way the real scan does — from the repository root with relative
        # paths — because gitleaks matches its path allowlist against the path
        # it reports, and a scan of an absolute directory reports absolute
        # paths that no repo-anchored pattern can match.
        run: |
          set -euo pipefail
          probe_dirs="docs/gauntlet-runs/_narrowness-probe notdocs/gauntlet-runs/_narrowness-probe src/_narrowness-probe"
          cleanup() { rm -rf docs/gauntlet-runs/_narrowness-probe notdocs src/_narrowness-probe "$RUNNER_TEMP/narrowness.json"; }
          trap cleanup EXIT
          for d in $probe_dirs; do mkdir -p "$d"; done
          token="$(printf '%s%s' 'zk9x2m4qv7r8t1w3y5u6i9' 'o0p2a4s6d8f0g1h3j5kq')"
          for d in $probe_dirs; do printf '"api_key": "%s"\n' "$token" > "$d/report.json"; done
          printf '%s%s\n' 'ghp_' 'A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8' \
            > docs/gauntlet-runs/_narrowness-probe/branded.txt
          set +e
          "$RUNNER_TEMP/bin/gitleaks" dir --config .gitleaks.toml --no-banner --redact \
            --report-format json --report-path "$RUNNER_TEMP/narrowness.json" .
          set -e
          python - "$RUNNER_TEMP/narrowness.json" <<'PY'
          import json, sys
          findings = json.load(open(sys.argv[1]))
          hits = {(f["File"], f["RuleID"]) for f in findings}
          entropy = {path for path, rule in hits if rule == "generic-api-key"}
          record = "docs/gauntlet-runs/_narrowness-probe/report.json"
          outside = "src/_narrowness-probe/report.json"
          lookalike = "notdocs/gauntlet-runs/_narrowness-probe/report.json"
          branded = ("docs/gauntlet-runs/_narrowness-probe/branded.txt", "github-pat")
          errors = []
          if record in entropy:
              errors.append("exemption did NOT apply inside docs/gauntlet-runs/")
          if outside not in entropy:
              errors.append("planted entropy token did NOT fire outside the record path")
          if lookalike not in entropy:
              errors.append("exemption leaked to a look-alike path (anchor lost): " + lookalike)
          if branded not in hits:
              errors.append("a provider-branded credential was suppressed inside the record path")
          if errors:
              for e in errors:
                  print("narrowness control:", e, file=sys.stderr)
              raise SystemExit(1)
          print("narrowness control: entropy exemption is anchored to the record path; "
                "look-alike paths and branded credentials still fire")
          PY
      - name: Scan the complete repository history
        run: |
          "$RUNNER_TEMP/bin/gitleaks" git --config .gitleaks.toml --no-banner --redact --log-opts="--all" .
