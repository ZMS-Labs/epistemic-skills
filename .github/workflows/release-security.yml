name: release-security

"on":
  pull_request:
    paths:
      - "README.md"
      - "RELEASING.md"
      - "docs/release/**"
      - ".claude-plugin/**"
      - ".cursor-plugin/**"
      - ".kimi-plugin/**"
      - "gemini-extension.json"
      - "plugins/epistemic-skills/.claude-plugin/**"
      - "plugins/epistemic-skills/.codex-plugin/**"
      - "plugins/epistemic-skills/.cursor-plugin/**"
      - "plugins/epistemic-skills/.kimi-plugin/**"
      - ".github/workflows/release-security.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "RELEASING.md"
      - "docs/release/**"
      - ".claude-plugin/**"
      - ".cursor-plugin/**"
      - ".kimi-plugin/**"
      - "gemini-extension.json"
      - "plugins/epistemic-skills/.claude-plugin/**"
      - "plugins/epistemic-skills/.codex-plugin/**"
      - "plugins/epistemic-skills/.cursor-plugin/**"
      - "plugins/epistemic-skills/.kimi-plugin/**"
      - ".github/workflows/release-security.yml"

permissions:
  contents: read

jobs:
  full-history-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install pinned gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Prove the scanner detects a planted secret
        run: |
          fixture="$(mktemp -d)"
          {
            printf '%s%s\n' '-----BEGIN RSA ' 'PRIVATE KEY-----'
            printf '%s\n' 'MIIEpAIBAAKCAQEAu4M7h2X9pQ6sV3nK8cD1fG5jL0wZrY2bT7mN9xE4'
            printf '%s%s\n' '-----END RSA ' 'PRIVATE KEY-----'
          } > "$fixture/positive-control.txt"
          set +e
          "$RUNNER_TEMP/bin/gitleaks" dir --no-banner --redact "$fixture"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "gitleaks positive control was not detected" >&2
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "gitleaks positive control failed with unexpected status $status" >&2
            exit "$status"
          fi
      - name: Scan the complete repository history
        run: |
          "$RUNNER_TEMP/bin/gitleaks" git --no-banner --redact --log-opts="--all" .
