name: epistemic-flexibility

"on":
  pull_request:
    paths:
      - "plugins/epistemic-skills/skills/**"
      - "plugins/epistemic-skills/contracts/**"
      - "docs/**"
      - ".ledger/**"
      - ".github/scripts/**"
      - ".github/workflows/epistemic-flexibility.yml"
  push:
    branches: [main]
    paths:
      - "plugins/epistemic-skills/skills/**"
      - "plugins/epistemic-skills/contracts/**"
      - "docs/**"
      - ".ledger/**"
      - ".github/scripts/**"
      - ".github/workflows/epistemic-flexibility.yml"

permissions:
  contents: read

jobs:
  stdlib-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tested revision without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Epistemic event contract tests
        run: python plugins/epistemic-skills/contracts/epistemic-events/test_epistemic_events.py
      - name: Compile epistemic event verifier
        run: python -m py_compile plugins/epistemic-skills/contracts/epistemic-events/verify_epistemic_event.py
      - name: Epistemic-flexibility protocol fixtures
        run: python plugins/epistemic-skills/skills/using-epistemic-skills/evals/epistemic-flexibility/run_tests.py
      - name: Behavioral fixture scorer self-test
        run: python plugins/epistemic-skills/skills/using-epistemic-skills/evals/epistemic-flexibility/behavioral/run_tests.py
      - name: Proportionality scorer polarity tests
        run: python plugins/epistemic-skills/skills/using-epistemic-skills/evals/proportionality/run_tests.py
      - name: Blinded proportionality packet tests
        run: python plugins/epistemic-skills/skills/using-epistemic-skills/evals/proportionality/blinded/tests/run_tests.py
      - name: Helix composition contract tests
        run: python plugins/epistemic-skills/skills/helix/evals/composition/tests/run_tests.py
      - name: Resolve derivation formal-rigor v2 structural scorer self-test
        run: python plugins/epistemic-skills/skills/resolve/derivation/evals/formal-rigor-v2-fixtures/tests/run_tests.py
      - name: Resolve derivation formal-rigor focused proportionality test
        run: python plugins/epistemic-skills/skills/resolve/derivation/evals/formal-rigor-v2-fixtures/tests/test_focused.py
      - name: Resolve derivation formal-rigor live-runner isolation tests
        run: python plugins/epistemic-skills/skills/resolve/derivation/evals/formal-rigor-v2-fixtures/tests/test_live_runner.py
      - name: Resolve derivation formal-rigor V3 post-hoc diagnostic tests
        run: python plugins/epistemic-skills/skills/resolve/derivation/evals/formal-rigor-v2-fixtures/tests/test_posthoc_diagnostic.py
      - name: UAT proportionality triage tests
        run: python plugins/epistemic-skills/skills/evidence-locked-uat/evals/triage/tests/run_tests.py
      - name: Decision Ledger proportionality tests
        run: python plugins/epistemic-skills/skills/decision-ledger/evals/proportionality/tests/run_tests.py
      - name: Open Questions trigger-and-scope tests
        run: python plugins/epistemic-skills/skills/open-questions/evals/trigger-and-scope/tests/run_tests.py
      - name: Context Audit trigger-and-scope tests
        run: python plugins/epistemic-skills/skills/context-audit/evals/trigger-and-scope/tests/run_tests.py
      - name: Recon initiative-mode trigger-and-scope tests
        run: python plugins/epistemic-skills/skills/recon/evals/initiative-trigger-and-scope/tests/run_tests.py
      - name: Resolve probe trigger-and-scope tests
        run: python plugins/epistemic-skills/skills/resolve/probe/evals/trigger-and-scope/tests/run_tests.py
      - name: Recon brief-mode trigger-and-scope tests
        run: python plugins/epistemic-skills/skills/recon/evals/brief-trigger-and-scope/tests/run_tests.py
      - name: Recon candidate-mode trigger-and-scope tests
        run: python plugins/epistemic-skills/skills/recon/evals/candidate-trigger-and-scope/tests/run_tests.py
      - name: Resolve literature trigger-and-scope tests
        run: python plugins/epistemic-skills/skills/resolve/literature/evals/trigger-and-scope/tests/run_tests.py
      - name: Write Goal trigger-and-scope tests
        run: python plugins/epistemic-skills/skills/write-goal/evals/trigger-and-scope/tests/run_tests.py
      - name: Outsource trigger-and-scope tests
        run: python plugins/epistemic-skills/skills/outsource/evals/trigger-and-scope/tests/run_tests.py
      - name: Enforcement-language precision audit
        run: |
          set +e
          python plugins/epistemic-skills/skills/evals/epistemic-flexibility/audit_enforcement_language.py > enforcement-language-report.ndjson
          status=$?
          cat enforcement-language-report.ndjson
          exit "$status"
      - name: Gauntlet validation-kernel gate
        run: |
          python plugins/epistemic-skills/skills/gauntlet/scripts/validate_ruling_set.py --self-test
          python plugins/epistemic-skills/skills/gauntlet/scripts/validate_ruling_set.py --scan docs/gauntlet-runs
      - name: Outsource packet and package integration
        run: python plugins/epistemic-skills/skills/outsource/tests/run_tests.py
      - name: Continuity resume-fixture committed results
        run: |
          score=plugins/epistemic-skills/skills/decision-ledger/evals/resume-fixtures/score.py
          results=plugins/epistemic-skills/skills/decision-ledger/evals/resume-fixtures/results
          expect_pass() {
            python "$score" --results-dir "$1"
          }
          expect_fail() {
            if python "$score" --results-dir "$1"; then
              echo "expected scorer failure for $1" >&2
              exit 1
            fi
          }
          expect_pass "$results/skilled/run-1"
          expect_pass "$results/skilled/run-2"
          expect_pass "$results/skilled/run-3"
          expect_fail "$results/baseline/run-1"
          expect_pass "$results/baseline/run-2"
          expect_fail "$results/baseline/run-3"
          expect_fail "$results/parody/run-1"
          expect_pass "$results/skilled-v4-2026-08-04/run-1"
          expect_pass "$results/skilled-v4-2026-08-04/run-2"
          expect_pass "$results/skilled-v4-2026-08-04/run-3"
          expect_fail "$results/baseline-v4-2026-08-04/run-1"
          expect_pass "$results/baseline-v4-2026-08-04/run-2"
          expect_pass "$results/baseline-v4-2026-08-04/run-3"
      - name: Pin-tag reachability guard
        run: python .github/scripts/check_pin_tags.py
      - name: DCO policy unit tests
        run: python .github/scripts/test_check_dco.py
      - name: Skill inventory contract
        run: python .github/scripts/check_skill_inventory.py
      - name: Skill surface synchronization
        run: python .github/scripts/sync_skill_surfaces.py --check
      - name: No phantom skill references in routing surfaces
        run: python .github/scripts/check_no_phantom_skills.py
      - name: Compile new Python
        run: |
          python -m py_compile \
            .github/scripts/check_json_artifacts.py \
            .github/scripts/check_ledger_append_only.py \
            .github/scripts/check_pin_tags.py \
            .github/scripts/check_skill_inventory.py \
            .github/scripts/check_no_phantom_skills.py \
            .github/scripts/sync_skill_surfaces.py \
            plugins/epistemic-skills/skills/using-epistemic-skills/evals/epistemic-flexibility/validate_trace.py \
            plugins/epistemic-skills/skills/using-epistemic-skills/evals/epistemic-flexibility/run_tests.py \
            plugins/epistemic-skills/skills/evals/epistemic-flexibility/audit_enforcement_language.py \
            plugins/epistemic-skills/skills/using-epistemic-skills/evals/epistemic-flexibility/behavioral/score_behavior.py \
            plugins/epistemic-skills/skills/using-epistemic-skills/evals/epistemic-flexibility/behavioral/run_tests.py \
            plugins/epistemic-skills/skills/using-epistemic-skills/evals/proportionality/score.py \
            plugins/epistemic-skills/skills/using-epistemic-skills/evals/proportionality/run_tests.py \
            plugins/epistemic-skills/skills/using-epistemic-skills/evals/proportionality/blinded/runner.py \
            plugins/epistemic-skills/skills/using-epistemic-skills/evals/proportionality/blinded/tests/run_tests.py \
            plugins/epistemic-skills/skills/helix/evals/composition/verify.py \
            plugins/epistemic-skills/skills/helix/evals/composition/tests/run_tests.py \
            plugins/epistemic-skills/skills/resolve/derivation/evals/formal-rigor-v2-fixtures/score.py \
            plugins/epistemic-skills/skills/resolve/derivation/evals/formal-rigor-v2-fixtures/tests/run_tests.py \
            plugins/epistemic-skills/skills/resolve/derivation/evals/formal-rigor-v2-fixtures/tests/test_focused.py \
            plugins/epistemic-skills/skills/resolve/derivation/evals/formal-rigor-v2-fixtures/tests/test_live_runner.py \
            plugins/epistemic-skills/skills/resolve/derivation/evals/formal-rigor-v2-fixtures/posthoc_diagnostic.py \
            plugins/epistemic-skills/skills/resolve/derivation/evals/formal-rigor-v2-fixtures/tests/test_posthoc_diagnostic.py \
            plugins/epistemic-skills/skills/resolve/derivation/evals/formal-rigor-v2-fixtures/run_live.py \
            plugins/epistemic-skills/skills/resolve/derivation/validate_record.py \
            plugins/epistemic-skills/skills/evidence-locked-uat/evals/triage/score.py \
            plugins/epistemic-skills/skills/evidence-locked-uat/evals/triage/tests/run_tests.py \
            plugins/epistemic-skills/skills/decision-ledger/evals/proportionality/score.py \
            plugins/epistemic-skills/skills/decision-ledger/evals/proportionality/tests/run_tests.py \
            plugins/epistemic-skills/skills/open-questions/evals/trigger-and-scope/score.py \
            plugins/epistemic-skills/skills/open-questions/evals/trigger-and-scope/tests/run_tests.py \
            plugins/epistemic-skills/skills/context-audit/evals/trigger-and-scope/score.py \
            plugins/epistemic-skills/skills/context-audit/evals/trigger-and-scope/tests/run_tests.py \
            plugins/epistemic-skills/skills/recon/evals/initiative-trigger-and-scope/score.py \
            plugins/epistemic-skills/skills/recon/evals/initiative-trigger-and-scope/tests/run_tests.py \
            plugins/epistemic-skills/skills/resolve/probe/evals/trigger-and-scope/score.py \
            plugins/epistemic-skills/skills/resolve/probe/evals/trigger-and-scope/tests/run_tests.py \
            plugins/epistemic-skills/skills/recon/evals/brief-trigger-and-scope/score.py \
            plugins/epistemic-skills/skills/recon/evals/brief-trigger-and-scope/tests/run_tests.py \
            plugins/epistemic-skills/skills/recon/evals/candidate-trigger-and-scope/score.py \
            plugins/epistemic-skills/skills/recon/evals/candidate-trigger-and-scope/tests/run_tests.py \
            plugins/epistemic-skills/skills/resolve/literature/evals/trigger-and-scope/score.py \
            plugins/epistemic-skills/skills/resolve/literature/evals/trigger-and-scope/tests/run_tests.py \
            plugins/epistemic-skills/skills/write-goal/evals/trigger-and-scope/score.py \
            plugins/epistemic-skills/skills/write-goal/evals/trigger-and-scope/tests/run_tests.py \
            plugins/epistemic-skills/skills/outsource/evals/trigger-and-scope/score.py \
            plugins/epistemic-skills/skills/outsource/evals/trigger-and-scope/tests/run_tests.py \
            plugins/epistemic-skills/skills/decision-ledger/reference/validate_examples.py \
            plugins/epistemic-skills/contracts/verify_calibration.py \
            plugins/epistemic-skills/skills/gauntlet/scripts/validate_ruling_set.py
      - name: Parse committed JSON in integration surfaces
        run: python .github/scripts/check_json_artifacts.py
      - name: Decision-ledger examples and durable store
        run: python plugins/epistemic-skills/skills/decision-ledger/reference/validate_examples.py
      - name: Durable ledger append-only against merge base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python .github/scripts/check_ledger_append_only.py --self-test
          git fetch --quiet --depth=1 origin "$BASE_SHA" || {
            echo "cannot fetch merge base $BASE_SHA — failing closed" >&2
            exit 1
          }
          if git cat-file -e "$BASE_SHA:.ledger/entries.jsonl" 2>/dev/null; then
            git show "$BASE_SHA:.ledger/entries.jsonl" > "$RUNNER_TEMP/base-ledger.jsonl"
          else
            : > "$RUNNER_TEMP/base-ledger.jsonl"
          fi
          python .github/scripts/check_ledger_append_only.py             --base "$RUNNER_TEMP/base-ledger.jsonl" --current .ledger/entries.jsonl
      - name: Existing receipt verifier
        run: python plugins/epistemic-skills/contracts/verify_receipt.py --self-test
      - name: Cross-product calibration contract
        run: python plugins/epistemic-skills/contracts/verify_calibration.py --self-test
      - name: Existing UAT judge
        run: python plugins/epistemic-skills/skills/evidence-locked-uat/scripts/judge.py --self-test
      - name: Existing gauntlet tests
        run: python plugins/epistemic-skills/skills/gauntlet/tests/run_tests.py
