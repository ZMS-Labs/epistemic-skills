name: finalize-pr110-truth

"on":
  push:
    branches:
      - chatgpt/practical-agency-manifest
    paths:
      - ".github/workflows/finalize-pr110-truth.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the PR branch with push credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/practical-agency-manifest
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Apply the bounded truth reconciliation
        run: python .github/scripts/finalize_pr110_truth.py
      - name: Verify focused contract and repository invariants
        shell: bash
        run: |
          set -euo pipefail
          python plugins/epistemic-skills/contracts/watch-commission/test_watch_commission.py
          python -m py_compile plugins/epistemic-skills/contracts/watch-commission/verify_watch_commission.py
          mapfile -t examples < <(find plugins/epistemic-skills/contracts/watch-commission/examples -maxdepth 1 -name 'valid-*.json' -print | sort)
          test "${#examples[@]}" -gt 0
          python plugins/epistemic-skills/contracts/watch-commission/verify_watch_commission.py "${examples[@]}"
          python .github/scripts/score_sentinels.py --self-test
          python .github/scripts/score_sentinels.py
          python .github/scripts/check_description_budget.py --self-test
          python .github/scripts/check_description_budget.py --report
          python .github/scripts/check_description_budget.py
          python .github/scripts/check_json_artifacts.py
          python .github/scripts/check_no_phantom_skills.py
          python .github/scripts/check_skill_inventory.py
          python .github/scripts/sync_skill_surfaces.py --check
          python .github/scripts/check_public_content.py --self-test
          python .github/scripts/check_public_content.py
          test ! -e .github/scripts/finalize_pr110_truth.py
          test ! -e .github/workflows/finalize-pr110-truth.yml
          git diff --check
      - name: Commit the verified documentation correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Expected factual reconciliation produced no diff" >&2
            exit 1
          fi
          git config user.name "SternOne"
          git config user.email "89846440+SternOne@users.noreply.github.com"
          git add -A
          git commit -m "docs: reconcile PR 110 with the Practical Agency seed" \
            -m "Replace create-from-zero and duplicate-skill assumptions with direct seed adoption; record the existing manifest skill's actual limitations; align the implementation plan and current-status Gauntlet evidence; and preserve the commission-watch versus mission-custody handoff boundary." \
            -m "Signed-off-by: SternOne <89846440+SternOne@users.noreply.github.com>"
      - name: Prove exact-commit clean-room checkout and package gate
        run: bash .github/scripts/cleanroom_ci.sh HEAD
      - name: Push only the verified commit
        run: git push origin HEAD:chatgpt/practical-agency-manifest
